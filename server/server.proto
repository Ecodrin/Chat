syntax = "proto3";

option go_package = "./internal/grps_chat";

package chat;

service Greeter {
    rpc Registration(RegistrationRequest) returns (StatusResponse);
    rpc Auth(AuthRequest) returns (StatusResponse);
    rpc ChatSession(stream Msg) returns (stream Msg);
    rpc AddContact(NewContactRequest) returns (StatusResponse);
    rpc GetContacts(TokenRequest) returns (GetContactsResponse);
} 

message NewContactRequest {
    string contact = 1;
    string token = 2;
}

message NewConversationRequest {
    string login = 1;
}

message GetContactsResponse {
    repeated string contats = 1;
}

message TokenRequest {
    string token = 1;
}

message StartGettingMsgsRequest {

}

message RegistrationRequest {
    string login = 1;
    string password = 2;
}

message AuthRequest {
    string login = 1;
    string password = 2;
}

message StatusResponse {
    int64 status = 1;
    string token = 2;
    string msg = 3;
}
message Msg {
    string token = 1;
    string conversationId = 2;
    string data = 3;
}