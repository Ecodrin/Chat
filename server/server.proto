syntax = "proto3";

option go_package = "./internal/grps_chat";

package chat;

service Greeter {
    rpc Registration(RegistrationRequest) returns (StatusRegistrationAuthResponse);
    rpc Auth(AuthRequest) returns (StatusRegistrationAuthResponse);
    rpc AddContact(NewContactRequest) returns (StatusResponse);
    rpc GetContacts(TokenRequest) returns (GetContactsResponse);
    rpc DeleteContact(DeleteContactRequest) returns (StatusResponse);
    rpc Disconnect(TokenRequest) returns (StatusResponse);
    rpc AcceptRequestContact(NewContactRequest) returns (StatusResponse);
    
    rpc ChatSession(stream InputMsg) returns (stream OutpuMsg);
} 

message StatusRegistrationAuthResponse {
    int64 status = 1;
    string token = 2;
}

message NewContactRequest {
    string contact = 1;
    string token = 2;
}

message DeleteContactRequest {
    string contact = 1;
    string token = 2;
}

message NewConversationRequest {
    string login = 1;
}

message GetContactsResponse {
    repeated string contats = 1;
}

message TokenRequest {
    string token = 1;
}

message StartGettingMsgsRequest {

}

message RegistrationRequest {
    string login = 1;
    string password = 2;
}

message AuthRequest {
    string login = 1;
    string password = 2;
}

message StatusResponse {
    int64 status = 1;
}

message InputMsg {
    string recipient = 1;
    string data = 2;
    int64 timestamp = 3;
    int64 statusMsg = 4;
    string token = 5;
    string id = 6;
}

message OutpuMsg {
    string recipient = 1;
    string data = 2;
    int64 timestamp = 3;
    int64 statusMsg = 4;
    string id = 5;
}